name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
  sdk: latest
  target: Android64
          

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: Geode Mod
          path: output/*.geode
